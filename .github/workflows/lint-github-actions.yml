name: Lint GitHub Actions workflows
on:
  pull_request:
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Check workflow files
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color
